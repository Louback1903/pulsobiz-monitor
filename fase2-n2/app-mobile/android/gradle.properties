org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
kotlin.daemon.jvmargs=-Xmx768m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Sem cache incremental do Kotlin e compilador dentro do Gradle (sem daemon extra):
# evita "Could not close incremental caches" depois de builds interrompidos e economiza memoria.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
